<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>FallenAngel Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌌 FallenAngel Launcher</h1>
    </header>

    <main>
      <div class="form-section">
        <div class="form-group">
          <label for="nickname">Nickname de jugador</label>
          <input
            type="text"
            id="nickname"
            placeholder="Ingresa tu nombre de jugador"
            autocomplete="off"
            maxlength="16"
          >
        </div>

        <div class="form-group">
          <label for="version">Versión del juego</label>
          <select id="version">
            <option value="">Seleccionando versiones...</option>
          </select>
          <button id="download-version-btn" class="btn-secondary" title="Descargar versión" style="margin-left: 8px;">⬇</button>
        </div>

        <div class="actions">
          <button id="launch-btn" class="btn-primary" disabled>
            <span class="btn-text">Jugar</span>
            <span class="btn-loader" style="display: none;">⏳</span>
          </button>

          <button id="refresh-btn" class="btn-secondary" title="Actualizar lista">
            ↻
          </button>
        </div>

        <div id="status" class="status-indicator">
          Estado: Listo
        </div>

        <div id="progress-bar" class="progress-bar" style="display: none;">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="logs-section">
        <h3>Registro</h3>
        <div id="logs-container" class="logs-container">
          <div id="logs" class="logs"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
